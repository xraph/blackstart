syntax = "proto3";

package blackstart.solver.v1;

// The power-flow solver service.
//
// Two rules govern this contract, and both exist because of how the solver is
// actually used rather than because of protobuf convention.
//
// First: ALL WIRE UNITS ARE SI. Watts, volt-amperes reactive, volts, ohms,
// radians, hertz. Per-unit conversion happens exactly twice — once on each
// side of this boundary — and never on the wire. A per-unit number is
// meaningless without the base it was computed against, and a wire format
// that carries one without the other is an invitation to combine two cases on
// different bases and get a plausible answer. Every field below states its
// unit. Frequencies in particular are carried in HERTZ, never as a fraction
// of a power base — 60 Hz is 60, not 1.0.
//
// Second: a network model is uploaded once and referenced by content hash
// thereafter. A contingency sweep runs thousands of solves against one model,
// and re-sending 2000 buses each time would make the transport cost more than
// the mathematics.
//
// ADVISORY ONLY. Nothing in this service writes to any control system, and no
// method here will ever accept a setpoint, a breaker command, or anything else
// a device could act on. That is architectural, not a phase-one limitation.
// See docs/SAFETY.md.

service SolverService {
  // Uploads a network model, in chunks, and returns its content hash.
  //
  // Client-streaming because a 2000-bus model does not belong in one message,
  // and because the server verifies the hash as it goes rather than buffering
  // the whole thing and discovering a mismatch at the end.
  rpc PutNetworkModel(stream PutNetworkModelRequest) returns (PutNetworkModelResponse);

  // Reports whether a model is already cached, so a client can skip an upload
  // it does not need.
  rpc HasNetworkModel(HasNetworkModelRequest) returns (HasNetworkModelResponse);

  // Solves one power flow.
  rpc SolvePowerFlow(SolvePowerFlowRequest) returns (SolvePowerFlowResponse);

  // Screens contingencies, streaming one result per contingency.
  //
  // Server-streaming so the caller can rank and stop early. On a large network
  // the first few hundred results usually settle which contingencies matter,
  // and waiting for all of them before seeing any is a worse experience for no
  // gain.
  rpc ScreenContingencies(ScreenContingenciesRequest) returns (stream ScreenContingenciesResponse);

  // Simulates a cascading failure from a set of initiating outages.
  //
  // Unary, deliberately, where ScreenContingencies streams. A cascade is one
  // atomic answer: step 3 means nothing without knowing whether step 30
  // happened, and a streamed partial cascade invites a client to render it as
  // a result — the same candidate-versus-finding error this contract guards
  // against everywhere else. The streaming on the screen exists so a caller
  // can rank thousands of INDEPENDENT contingencies and stop early. Neither
  // property holds here.
  rpc SimulateCascade(SimulateCascadeRequest) returns (SimulateCascadeResponse);
}

// How a bus participates in the power flow.
enum BusKind {
  BUS_KIND_UNSPECIFIED = 0;
  // Load bus: real and reactive injection known, voltage unknown.
  BUS_KIND_PQ = 1;
  // Generator bus: real injection and voltage magnitude known.
  BUS_KIND_PV = 2;
  // Reference bus. Exactly one is required: without it the equations have no
  // absolute angle reference and are singular.
  BUS_KIND_SLACK = 3;
}

// A bus in the network.
message Bus {
  // Stable identifier from the platform, carried through so a result can name
  // the bus it belongs to without a lookup table.
  string id = 1;

  BusKind kind = 2;

  // Net real power injection, WATTS. Generation positive, load negative.
  double p_injection_w = 3;
  // Net reactive power injection, VOLT-AMPERES REACTIVE.
  double q_injection_var = 4;

  // Voltage magnitude, VOLTS (line-to-line RMS). Fixed for PV and slack buses;
  // a starting value elsewhere.
  double v_magnitude_v = 5;
  // Voltage angle, RADIANS. Fixed for the slack bus.
  double v_angle_rad = 6;

  // Reactive output limits, VOLT-AMPERES REACTIVE.
  //
  // Optional because absent means unlimited, which is not the same as zero. A
  // generator with no stated limits has unknown limits, and defaulting a
  // missing value to zero would turn missing data into a voltage collapse
  // indistinguishable from a real finding.
  optional double q_min_var = 7;
  optional double q_max_var = 8;

  // Shunt admittance to ground, SIEMENS.
  double g_shunt_s = 9;
  double b_shunt_s = 10;

  // Real output limits, WATTS.
  //
  // Optional for the same reason the reactive limits above are: absent means
  // unknown, not zero, and a generator defaulted to a maximum of zero would
  // make every island short of generation. These are not cascade-only — they
  // are what DC-OPF needs later.
  optional double p_min_w = 11;
  optional double p_max_w = 12;

  // Inertia constant, SECONDS, on the machine's own rating.
  //
  // Optional, and unlike the limits there is no numeric value here that could
  // mean "unknown". Zero inertia says an island collapses on any imbalance;
  // infinite inertia says frequency never moves. Both are confident physical
  // claims, and an unpopulated import must make neither.
  optional double inertia_h_s = 13;

  // Governor droop, per unit, dimensionless. Typically 0.05.
  //
  // One of the few fields here with no unit suffix, like `tap`.
  optional double droop_r = 14;
}

// A branch: a line, cable, or transformer.
message Branch {
  // Stable identifier from the platform.
  string id = 1;

  // Indices into the model's bus list.
  uint32 from_bus = 2;
  uint32 to_bus = 3;

  // Series impedance, OHMS.
  double r_ohm = 4;
  // Must be non-zero: a zero-impedance branch is a bus merge that topology
  // processing should already have collapsed.
  double x_ohm = 5;

  // Total line charging susceptance, SIEMENS.
  double b_shunt_s = 6;

  // Long-term rating, VOLT-AMPERES. Zero means unrated, which means the limit
  // is unknown rather than zero — an unrated branch is never reported as
  // overloaded.
  double rating_va = 7;

  // Whether the branch is in service. An out-of-service branch stays in the
  // model so a contingency can restore it without shifting every index.
  bool in_service = 8;

  // Off-nominal turns ratio, applied at the from-end. 1.0 for a line.
  //
  // Dimensionless, so it is one of the few fields here with no unit suffix.
  double tap = 9;
  // Phase shift, RADIANS, applied at the from-end. Zero for a line.
  double shift_rad = 10;
}

// A complete network model.
message NetworkModel {
  // Human-readable name, for logs and result provenance.
  string name = 1;

  // The per-unit base the server will convert to. Carried explicitly rather
  // than assumed, so that a model and the base it is interpreted against
  // travel together and cannot be mismatched.
  double s_base_va = 2;
  double v_base_v = 3;

  repeated Bus buses = 4;
  repeated Branch branches = 5;
}

message PutNetworkModelRequest {
  oneof payload {
    // Sent once, before any chunk.
    PutNetworkModelHeader header = 1;
    // A slice of the serialized NetworkModel.
    bytes chunk = 2;
  }
}

message PutNetworkModelHeader {
  // The sha256 the client expects, hex-encoded lowercase.
  //
  // Sent up front so the server can verify as it receives rather than
  // buffering the whole model and discovering a mismatch at the end — and so
  // that a server which already has this model can say so immediately.
  string content_hash = 1;

  // Total size in bytes, for preallocation and for rejecting a stream that
  // does not deliver what it promised.
  uint64 size_bytes = 2;
}

message PutNetworkModelResponse {
  // The hash the server computed. It equals the header's hash, or the call
  // failed — this is returned rather than assumed so a client can log what was
  // actually stored.
  string content_hash = 1;

  // Whether the server already had this model, so the upload was redundant.
  // Reported rather than hidden because a client uploading the same model
  // repeatedly has a caching bug worth surfacing.
  bool already_present = 2;
}

message HasNetworkModelRequest {
  string content_hash = 1;
}

message HasNetworkModelResponse {
  bool present = 1;
}

// An override applied to a cached model for one solve.
//
// Contingency analysis changes one branch's status or one bus's injection
// against an otherwise fixed network. Without overrides every contingency
// would re-upload the whole model, which is the cost this design exists to
// avoid.
message Override {
  oneof change {
    BranchStatus branch_status = 1;
    BusInjection bus_injection = 2;
    BranchRating branch_rating = 3;
  }
}

message BranchStatus {
  uint32 branch = 1;
  bool in_service = 2;
}

// One branch's long-term rating, replaced for this solve.
//
// A dynamic line rating is the same network under different weather, not a
// different network: the impedances, the topology and every other branch are
// unchanged, and only the limit the flow is judged against moves. That is an
// override for exactly the reason a contingency is one.
message BranchRating {
  uint32 branch = 1;
  // Long-term rating, VOLT-AMPERES, matching Branch.rating_va.
  //
  // Zero means unrated — the limit is unknown rather than zero — which is
  // Branch.rating_va's convention and must stay that way here.
  //
  // What a zero actually does is SUPPRESS a violation, not invent one. Every
  // consumer skips a branch whose rating is not positive: the DC flow's
  // loading pass, the contingency screen and its verifier, the cascade
  // verifier, and the service's result assembly. The overcurrent element
  // reports no trip at all for one. So an override of zero does not trip the
  // network — it quietly removes that branch from every violation check, and
  // a line at 180% of its true limit is reported as an all-clear.
  //
  // For an advisory tool a false all-clear is the worse failure, which is why
  // a pipeline that could not derive a rating for a branch must send no
  // override for it rather than an override of zero.
  double rating_va = 2;
}

message BusInjection {
  uint32 bus = 1;
  // WATTS and VOLT-AMPERES REACTIVE, as everywhere on this wire.
  double p_injection_w = 2;
  double q_injection_var = 3;
}

// Which power flow to run.
enum Method {
  METHOD_UNSPECIFIED = 0;
  // Linearized: real power only, no voltages. What the contingency screen uses.
  METHOD_DC = 1;
  // Full nonlinear solve by Newton-Raphson.
  METHOD_AC = 2;
}

message SolvePowerFlowRequest {
  // The model to solve, by hash. Never the model itself: a client that has
  // lost the server's cache should re-upload deliberately rather than have
  // every request silently carry a megabyte.
  //
  // An unknown hash returns FAILED_PRECONDITION with a ModelNotCached detail,
  // so the client can upload and retry exactly once — which makes a server
  // restart invisible.
  string content_hash = 1;

  Method method = 2;

  // Applied in order, so a later override wins over an earlier one on the same
  // element.
  repeated Override overrides = 3;

  // Enforce generator reactive limits. Off by default because a limited and an
  // unlimited solve answer different questions, and the caller has to say
  // which one it is asking.
  bool enforce_reactive_limits = 4;

  // Convergence threshold on the largest bus mismatch, WATTS. Zero means the
  // server's default.
  double tolerance_w = 5;

  // Maximum Newton iterations. Zero means the server's default.
  uint32 max_iterations = 6;
}

message BusResult {
  // Voltage magnitude, VOLTS.
  double v_magnitude_v = 1;
  // Voltage angle, RADIANS.
  double v_angle_rad = 2;
  // Net injection the solution required, WATTS and VOLT-AMPERES REACTIVE. At
  // the slack this is what the reference had to supply.
  double p_injection_w = 3;
  double q_injection_var = 4;
}

message BranchResult {
  // Real power at the from-end, WATTS, positive in the from→to direction.
  double p_flow_w = 1;
  // Flow magnitude over rating. Zero for an unrated branch.
  double loading = 2;
}

message SolvePowerFlowResponse {
  repeated BusResult buses = 1;
  repeated BranchResult branches = 2;

  // Iterations taken. Part of the result rather than a log line: a golden that
  // captures convergence behaviour catches a change in the Jacobian that still
  // lands on the same answer.
  uint32 iterations = 3;

  // Largest bus mismatch at convergence, WATTS.
  double residual_w = 4;

  // Buses whose generators are pinned at a reactive limit. Not violations
  // themselves, but the reason a voltage violation happened — reporting the
  // symptom without the cause sends an operator looking in the wrong place.
  repeated uint32 binding_generators = 5;

  // The versions this result came from, so it can be reproduced. A number
  // without these is not reproducible, which is the one thing this platform
  // cannot ship.
  string solver_version = 6;
  string model_hash = 7;
}

// One contingency to screen.
message Contingency {
  // Stable identifier, carried into the result so a report can name what
  // failed rather than printing an index at someone who thinks in line names.
  string id = 1;
  // Index of the branch taken out of service.
  uint32 branch = 2;
}

message ScreenContingenciesRequest {
  string content_hash = 1;

  // Applied before screening, so a sweep can run against an off-nominal
  // operating point without re-uploading the model.
  repeated Override overrides = 2;

  // Which contingencies, in the order to evaluate them.
  //
  // The order is the caller's, deliberately. Phase 2 fills it with every
  // branch in index order; a risk model supplies a better one later, and that
  // substitution is the coupling this whole project exists to demonstrate.
  // Empty means every in-service branch.
  repeated Contingency contingencies = 3;

  // Report branches loaded above this ratio of their rating. Zero means 1.0.
  double violation_threshold = 4;
}

// What the screen could say about one contingency.
enum Screenability {
  SCREENABILITY_UNSPECIFIED = 0;
  // The outage redistributes onto other branches and was screened.
  SCREENABILITY_SCREENED = 1;
  // The outage disconnects the network, so its flow has nowhere to go. A real
  // contingency, but not one a linear factor can answer — it must be
  // simulated. This is NOT a safe result and must not be ranked as one.
  SCREENABILITY_RADIAL = 2;
  // The branch was already out of service, so its outage is not a contingency.
  SCREENABILITY_NOT_APPLICABLE = 3;
}

message Violation {
  uint32 branch = 1;
  // Post-contingency flow, WATTS.
  double p_flow_w = 2;
  // The rating it exceeded, VOLT-AMPERES.
  double rating_va = 3;
  // Flow magnitude over rating, above the threshold by construction.
  double loading = 4;
}

// One contingency's result. The RPC streams one of these per contingency, so
// "response" here names a single element of the stream rather than the whole
// sweep — buf's naming convention, which is worth following even though the
// singular reading is the useful one.
message ScreenContingenciesResponse {
  Contingency contingency = 1;

  Screenability screenability = 2;

  // Branches over their rating, worst first, so a caller that truncates keeps
  // what matters.
  repeated Violation violations = 3;

  // Worst loading seen anywhere, including branches within their rating, so a
  // contingency with no violations still ranks against others.
  //
  // Optional, and absent when screenability is not SCREENED. Absent rather
  // than zero: a contingency that could not be evaluated is not a safe one,
  // and sorting it as though it had no loading buries exactly the case that
  // most needs a simulation.
  optional double worst_loading = 4;
}

// One stage of an under-frequency load-shedding scheme.
message UflsStage {
  // Trip frequency, HERTZ.
  double at_hz = 1;
  // Fraction of the island's load shed when this stage fires, in [0, 1].
  double shed_fraction = 2;
  // Intentional delay before the stage acts, SECONDS, on top of relay and
  // breaker time.
  double delay_s = 3;
}

// An under-frequency load-shedding scheme: an ordered ladder of shed stages,
// bounded by the frequencies where the scheme gives up and where it lets shed
// load back on.
message UflsScheme {
  // Conventionally shallowest first, though the simulator evaluates every
  // stage against the instantaneous frequency rather than trusting the order.
  repeated UflsStage stages = 1;
  // Frequency below which the island is treated as lost regardless of what
  // stages remain, HERTZ.
  double floor_hz = 2;
  // Frequency above which previously shed load may be restored, HERTZ.
  double ceiling_hz = 3;
}

// An IEC 60255-151 inverse-time overcurrent characteristic. Mirrors
// bs_protection::Curve on the Rust side; this is that type's wire form.
enum Curve {
  CURVE_UNSPECIFIED = 0;
  // A = 0.14, B = 0.02. The usual transmission choice.
  CURVE_STANDARD_INVERSE = 1;
  // A = 13.5, B = 1.
  CURVE_VERY_INVERSE = 2;
  // A = 80, B = 2. Grades against fuses.
  CURVE_EXTREMELY_INVERSE = 3;
}

// Overcurrent protection on one branch: an inverse-time curve plus an
// optional instantaneous element.
message OvercurrentSettings {
  // Pickup, as a multiple of the branch's own rating. Dimensionless. Zero
  // means the server's default of 1.0 — pickup at rating, the same physical
  // convention the defaults below follow.
  double pickup = 1;
  // Time multiplier, scaling the whole curve. Dimensionless. Zero means the
  // server's default.
  double time_multiplier = 2;
  // Instantaneous element, as a multiple of the rating. Optional because
  // absence disables it outright — a multiple of zero would trip on any flow
  // at all, which is a different and much more aggressive setting.
  optional double instantaneous = 3;
  // Zero (CURVE_UNSPECIFIED) means the server's default, StandardInverse —
  // consistent with the other zero-valued fields on this message.
  Curve curve = 4;
  // Breaker operating time, SECONDS. The floor on any trip: the curve can ask
  // for less than the breaker can physically deliver. Zero means the
  // server's default.
  double breaker_time_s = 5;
}

// One distance-relay zone.
message DistanceZone {
  // Reach, as a multiple of the protected branch's own reactance.
  // Dimensionless, and deliberately relative to the branch rather than an
  // absolute ohm value: the branch's own reactance is what a relay set at its
  // own line is graded against.
  double reach = 1;
  // Intentional delay, SECONDS, on top of the breaker time.
  double delay_s = 2;
}

// Distance protection on one branch: a set of impedance zones.
message DistanceSettings {
  // Conventionally narrowest first, though the fastest zone that sees the
  // branch is the one that operates regardless of list order.
  repeated DistanceZone zones = 1;
  // Breaker operating time, SECONDS. Zero means the server's default.
  double breaker_time_s = 2;
}

// Protection on one branch: overcurrent, distance, or both. Either half may
// be left unset, which disables that scheme on the branch rather than
// defaulting it — a branch protected by distance only should not gain a
// phantom overcurrent element because the message has a field for one.
message ProtectionSettings {
  OvercurrentSettings overcurrent = 1;
  DistanceSettings distance = 2;
}

// Protection settings for one branch, overriding whatever
// SimulateCascadeRequest.protection supplies as the network-wide default.
message BranchProtection {
  uint32 branch = 1;
  ProtectionSettings settings = 2;
}

message SimulateCascadeRequest {
  string content_hash = 1;

  // Applied before the cascade starts, so a run can begin from an off-nominal
  // operating point without re-uploading the model.
  repeated Override overrides = 2;

  // Branches taken out of service at t=0. Everything after this is the
  // simulator's consequence of these outages, not a further instruction.
  repeated uint32 initiating = 3;

  // Network-wide protection, applied to every branch that BranchProtection
  // below does not override. Its zero-valued fields default server-side to a
  // relay set at its own branch's rating — a physical convention, the same
  // reasoning the per-field comments above spell out.
  ProtectionSettings protection = 4;

  // Per-branch overrides of `protection`, for the branches whose relays are
  // not at the network default.
  repeated BranchProtection branch_protection = 5;

  // Under-frequency load shedding, network-wide.
  //
  // Unlike protection settings, this has NO server-side default. Absent means
  // no shedding happens at all, ever, on any island. A shedding schedule is a
  // utility's policy choice — which frequency, which fraction, which delay —
  // and a tool that quietly supplied one would be asserting a policy it has
  // no standing to assert. Protection settings default because a relay set at
  // its own line's rating is a physical convention available to everyone;
  // there is no equivalent convention for load-shedding policy.
  UflsScheme ufls = 6;

  // Events within this many seconds of each other on the same element are
  // merged into one, SECONDS. Zero means no coalescing. Exists because a
  // relay chattering across a step boundary would otherwise log the same
  // trip twice.
  double coalesce_window_s = 7;

  // Hard cap on the number of discrete events simulated. Zero means the
  // server's default. Guards against a cascade that never settles consuming
  // unbounded time; hitting the cap produces outcome TRUNCATED rather than a
  // silently incomplete SETTLED result.
  uint32 max_steps = 8;

  // Simulated time horizon, SECONDS. Zero means the server's default. A
  // cascade still running at the horizon also produces TRUNCATED.
  double horizon_s = 9;
}

// What kind of thing happened at one point in the cascade.
//
// Must match the operator console's schema exactly — see
// web/packages/schema/src/cascade.ts, CASCADE_EVENT_KINDS. The console
// validates every event against that list and rejects anything it does not
// recognize, so a value added here without a matching console change
// produces a cascade the console refuses to render.
enum CascadeEventKind {
  CASCADE_EVENT_KIND_UNSPECIFIED = 0;
  // An element crossed its rating. Logged separately from the trip it may
  // cause, so a reader can see how long the margin was gone before
  // protection acted.
  CASCADE_EVENT_KIND_OVERLOAD = 1;
  // A branch's protection operated and removed it from service.
  CASCADE_EVENT_KIND_TRIP = 2;
  // The network split, forming or reshaping islands.
  CASCADE_EVENT_KIND_ISLAND = 3;
  // Under-frequency load shedding fired.
  CASCADE_EVENT_KIND_SHED = 4;
  // An island stopped changing and is being reported as settled.
  CASCADE_EVENT_KIND_STABILISE = 5;
}

message CascadeEvent {
  // Seconds since the initiating outage.
  double at_s = 1;

  CascadeEventKind kind = 2;

  // The element as an operator names it, e.g. "ln TULIA-PLAINVIEW 345".
  string element = 3;

  // Why, in the operator's terms, e.g. "dist zone 1", "163% - 2s", "underfreq".
  //
  // No separate typed cause field: the simulator's own event log
  // (`bs_cascade::Event`) keeps only this formatted string, not the
  // structured `bs_protection::TripCause` it was built from, so a typed wire
  // field could only be populated by parsing this text back apart — exactly
  // the fragile, plausible-looking reconstruction this contract exists to
  // avoid elsewhere. Threading the structured cause through would mean
  // extending `bs-cascade`'s own event type, out of this contract's scope.
  string detail = 4;

  // Which island this event belongs to.
  //
  // Optional, and distinct from island zero: an event before the network has
  // split — an overload on the still-connected system, say — is not
  // island-specific, and reporting it against island 0 would claim a split
  // that has not happened yet.
  optional uint32 island = 5;
}

// The worst thing that happened to an island over the whole run, on the
// frequency axis. See IslandState.condition for why this is peak severity
// rather than the state at the final instant.
//
// Order is significant: STABLE < RECOVERING < SHEDDING < COLLAPSED. Reporting
// logic takes the maximum over the run's history in this order.
enum IslandCondition {
  ISLAND_CONDITION_UNSPECIFIED = 0;
  ISLAND_CONDITION_STABLE = 1;
  ISLAND_CONDITION_RECOVERING = 2;
  ISLAND_CONDITION_SHEDDING = 3;
  ISLAND_CONDITION_COLLAPSED = 4;
}

// What the AC solve on an island's final state found. Separate from
// IslandCondition deliberately: an island that is frequency-stable and
// voltage-insolvable is a real and important combination, and a single field
// would force it to be reported as only one of the two.
enum AcVerdict {
  AC_VERDICT_UNSPECIFIED = 0;
  AC_VERDICT_SECURE = 1;
  AC_VERDICT_VIOLATED = 2;
  AC_VERDICT_INSOLVABLE = 3;
}

// One point on an island's frequency curve.
message FrequencySample {
  // Seconds since the initiating outage, on the SAME clock as
  // CascadeEvent.at_s — so a scrubber can put the curve and the event log on
  // one axis without rescaling either.
  double at_s = 1;

  // Absolute frequency, HERTZ, the same convention as every other frequency
  // field on this wire — not a deviation from nominal. A curve of deviations
  // would sit near zero on an axis calibrated to the survival band and read
  // as a collapsed island when it is not.
  double hz = 2;
}

message IslandState {
  // Indices into the model's bus list.
  repeated uint32 buses = 1;

  // Peak severity reached anywhere in the run, not the state at the final
  // instant. An island that shed a quarter of its load and then recovered
  // reports SHEDDING, not STABLE — collapsing to the final state would hide
  // the most important thing that happened to it.
  IslandCondition condition = 2;

  AcVerdict verdict = 3;

  // Generation minus load at the final instant, WATTS. Negative means the
  // island is short (load exceeds generation); positive means it has
  // surplus. This message is the authority on the sign: both the Rust
  // producer (bs_cascade::verify::IslandReport::balance) and the Go
  // consumer (extensions/cascade/run.Island.Balance) must agree with it,
  // not with bs-cascade's own internal dispatch convention
  // (bs_cascade::dispatch::Balance::gap), which is the opposite sign
  // (load minus generation, positive for a shortfall) because it exists to
  // match bs-frequency's imbalance convention instead.
  double balance_w = 4;

  // Frequency, HERTZ, at the LAST instant this island had a machine to
  // report one from — the settling value, deliberately a final-instant
  // quantity unlike nadir and rate-of-change below. "Where did it end up"
  // is the question this field answers, not "how bad did it get"; folding
  // it into a peak-severity figure the way those two are would hide a
  // genuine recovery behind whatever the worst moment looked like.
  //
  // Optional along with nadir and rate-of-change below: an island with no
  // machine data — no inertia, no governors — has no frequency to report,
  // which is not the same as a frequency of zero.
  optional double frequency_hz = 5;
  // Lowest frequency reached ANYWHERE in the run, HERTZ — the most severe
  // value seen, not the value at the final instant, the same peak-severity
  // rule `condition` above already follows. What decides whether the
  // island survives.
  optional double nadir_hz = 6;
  // Largest-MAGNITUDE rate of change of frequency observed anywhere in the
  // run, HERTZ PER SECOND, SIGNED. "Largest magnitude" is deliberately not
  // "maximum": rate of change is negative for a shortfall, so the more
  // severe swing is the one furthest from zero in either direction: a plain
  // maximum would let a mild positive recovery swing outrank a severe
  // negative collapse swing just for being the larger signed number.
  optional double rocof_hz_s = 7;

  // Load shed on this island over the whole run, WATTS — accumulated across
  // every UFLS stage that fired for it, not merely the fraction shed at
  // whichever instant the island is being reported for.
  double shed_w = 8;

  // The island's frequency curve over the run, in time order.
  //
  // Decimated server-side to a couple of hundred points — the integration
  // produces thousands, which is far more than a scrubber resolves. The
  // reduction keeps each bucket's extrema rather than sampling at a stride,
  // so the nadir reported in `nadir_hz` above is guaranteed to appear on the
  // curve too. A curve that disagreed with the number printed beside it
  // would be worse than a coarse one.
  //
  // Empty, not a flat line at zero, when no step ever observed a machine on
  // this island — the same "absent, not zero" rule `frequency_hz`,
  // `nadir_hz`, and `rocof_hz_s` above already follow.
  repeated FrequencySample trace = 9;
}

// How the cascade ended.
enum CascadeOutcome {
  CASCADE_OUTCOME_UNSPECIFIED = 0;
  // Every island reached a state that stopped changing before the horizon or
  // step cap.
  CASCADE_OUTCOME_SETTLED = 1;
  // The horizon or max_steps was reached with at least one island still
  // changing. Not a failure of the solver — a cascade that genuinely runs
  // longer than the budget allowed.
  CASCADE_OUTCOME_TRUNCATED = 2;
  // Every island collapsed.
  CASCADE_OUTCOME_COLLAPSED = 3;
}

message SimulateCascadeResponse {
  CascadeOutcome outcome = 1;

  // In simulated-time order, as produced. Reordering, if a client wants
  // newest-first, is a display concern and stays off the wire.
  repeated CascadeEvent events = 2;

  repeated IslandState islands = 3;

  // Total load shed across every island, WATTS.
  double load_lost_w = 4;

  // Discrete events simulated, for comparing against max_steps.
  uint32 steps = 5;

  // SIMULATED time the cascade covered, SECONDS — the run's own clock, the
  // sum of every step's `at`, not how long the solve took on the wall
  // clock. This is the useful number for a caller comparing against a
  // request's horizon; wall-clock duration is a deployment concern this
  // message does not carry.
  double elapsed_s = 6;

  // The versions this result came from, so it can be reproduced.
  string solver_version = 7;
  string model_hash = 8;

  // The outages that started this cascade, as branch IDENTIFIERS rather than
  // the indices SimulateCascadeRequest.initiating carries — an operator
  // names lines, and the event log above already reports ids for that
  // reason.
  //
  // Resolved against the model server-side and echoed back here so a client
  // can caption its own result without holding the index space the request
  // used to name them.
  repeated string initiating = 9;
}
