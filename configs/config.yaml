# BLACKSTART base configuration.
#
# This file is committed, so it carries nothing secret. Connection strings go
# in config.local.yaml (gitignored, see config.local.yaml.example) or in the
# environment, which wins over both.
#
# Precedence, lowest to highest:
#   built-in defaults  <  configs/config.yaml  <  configs/config.local.yaml
#     <  BLACKSTART_* environment variables
#
# Discovery walks upward from configs/ and from the working directory, so a
# config.yaml at the repository root is also honoured.

app:
  environment: development

server:
  # Empty means no listener, which is what bsctl wants. The server binary sets
  # :8080 for itself when nothing else does.
  address: ":8080"

# Grove reads database.driver and database.dsn from this key. The DSN is
# deliberately absent here — a database credential is still a credential even
# on a project that only handles public data.
database:
  driver: postgres

# The Rust power-flow service. Empty means no solver, which is a legitimate
# configuration: `bsctl entities` and `blackstart migrate` never call one, and
# requiring it would make every command depend on a process it does not use.
# The solver-backed extensions are registered only when an address is set.
solver:
  address: "127.0.0.1:50051"
  # Recorded with every contingency run. The screen stream does not carry a
  # version — the contract puts version fields on the solve response, since
  # repeating them across thousands of streamed results would be noise — so the
  # host supplies it. Left empty, the extension records a conspicuous
  # placeholder rather than a plausible version.
  version: ""

extensions:
  fabric:
    # Blackstart is single-tenant. Fabriq has no default-tenant mode by design:
    # missing tenant context is a hard failure rather than a silent write into
    # someone else's rows.
    tenant: blackstart

    # Redis carries the outbox relay. Without a worker draining it,
    # fabriq_outbox grows without bound, so the server refuses to start with a
    # worker and no Redis.
    redis:
      addr: "localhost:56379"

    # FalkorDB backs the graph projection. Ports match deploy/docker-compose.dev.yml,
    # which is offset from the defaults so a local install of either service
    # keeps working alongside it.
    falkordb:
      addr: "localhost:56380"

    # The content-addressable byte plane, where canonical network encodings
    # live. Fabriq wires trove behind this and deduplicates by content hash, so
    # re-importing an unchanged case stores no second copy.
    #
    # A filesystem path in development; a driver URL wherever there is object
    # storage. Empty disables the plane, and an import then fails rather than
    # silently putting megabytes of encoding back into a Postgres column.
    #
    # local:// rather than file://, and the difference is not cosmetic: only
    # the local scheme rebuilds a relative path from the URL's host and path,
    # so "file://./.data" resolves to "/.data" and fails on a read-only root.
    storage:
      driver: "local://./.data/blobs"

  # Numerical weather prediction ingest.
  #
  # There is no enabled flag. The loop runs when a source and at least one feed
  # are named here and the process drains workers — the server does, bsctl does
  # not — because a feed configured in a process with no worker is inert, and a
  # flag claiming otherwise could only lie about it.
  #
  # The slugs are registry entries, not URLs. Resolving through datasource is
  # the only route to a fetch, so a source outside spec section 8 cannot be
  # polled without first being added to the registry.
  weather:
    poll:
      source: noaa
      feeds:
        hrrr: hrrr
      interval: 10m

      # How far back to walk filling gaps. A missed cycle cannot be recovered
      # once NOAA's rolling archive passes it, and Phase 6's backtest cannot
      # reconstruct what was knowable at a time whose forecast was never
      # stored. A backtest-focused deployment widens this; a demo sets it to 0.
      backfill: 24h

      # Forecast hours retrieved per cycle. Every hour of a cycle costs one
      # ranged request per field, so this is the main lever on ingest volume.
      hours: [0, 1, 2, 3, 6, 12, 18]

  # Conductor loading and dynamic line ratings.
  #
  # Runs whenever the process drains workers; it needs no registry slugs
  # because it reads what weather already stored. Shorter than the weather
  # interval because it makes no network requests — the cost of asking often is
  # one query, and the benefit is a rating that follows its forecast by minutes.
  hazard:
    compute:
      interval: 2m

      # How far back to consider unrated cycles. An unrated forecast from last
      # week is not an operational problem, and sweeping all history every tick
      # would grow without bound.
      lookback: 12h
