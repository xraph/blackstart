# cargo-deny configuration.
#
# Blackstart ships under Apache-2.0. The licence boundary is not a preference
# here — it decides which numerical libraries the solver may use, and that is a
# design constraint rather than a packaging detail:
#
#   - SuiteSparse UMFPACK is GPL-family. Excluded outright.
#   - KLU is LGPL-2.1+ and is, algorithmically, the ideal choice for circuit
#     and power matrices. It may only ever sit behind a feature flag that is
#     off in the shipped default build.
#   - faer is MIT and is therefore the in-tree default.
#
# The same rule is why the IEC 61850 SCL parser is written from the published
# schema instead of wrapping libiec61850, which is GPLv3.

[graph]
all-features = true

[licenses]
version = 2
confidence-threshold = 0.9

allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    # File-level copyleft. It does not propagate to the rest of the work, so it
    # is compatible with an Apache-2.0 release, but a new MPL dependency is
    # worth a second look before it lands.
    "MPL-2.0",
]

# Anything not in `allow` is denied. GPL, LGPL, AGPL and SSPL are therefore
# already excluded; they are listed in the comment above rather than in a deny
# list so that a newly-encountered copyleft licence also fails rather than
# slipping through because nobody thought to name it.

[bans]
multiple-versions = "warn"
wildcards = "deny"

deny = [
    # Belt and braces alongside the licence rules: these are the specific
    # crates whose presence would mean a GPL-family solver had been linked.
    { crate = "suitesparse-sys", reason = "UMFPACK/SuiteSparse is GPL-family; use faer" },
    { crate = "umfpack", reason = "GPL-family; use faer" },
]

[advisories]
version = 2
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
