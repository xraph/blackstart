name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch supersedes an older one, except on main
# where every commit's status is part of the record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"

jobs:
  # The advisory-only boundary (docs/SAFETY.md). Runs first and on its own
  # because it is the one check whose failure is a safety issue rather than a
  # quality issue, and it should be legible as such in the checks list.
  safety:
    name: Safety boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check no actuation capability exists
        run: ./scripts/check-safety-boundary.sh

  lint-go:
    name: Lint (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1
          args: --timeout=5m

      - name: go vet
        run: go vet ./...

      - name: go mod tidy is committed
        run: |
          go mod tidy
          (cd tools && go mod tidy)
          if ! git diff --exit-code -- '**/go.mod' '**/go.sum' go.mod go.sum; then
            echo "::error::go.mod or go.sum is not tidy — run 'make tidy' and commit the result"
            exit 1
          fi

  build-go:
    name: Build (Go)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go build ./...

  test-go:
    name: Test (Go, unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # -short excludes anything needing Postgres, Redis or FalkorDB. The
      # integration job that provides those arrives with the first store.
      - run: go test -race -short -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  lint-web:
    name: Lint (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck

# Jobs that arrive with the code they check, rather than being added now as
# no-ops. An empty Cargo workspace fails `cargo clippy` outright ("the
# manifest is virtual, and the workspace has no members"), and a job that is
# green because it skipped is indistinguishable from one that is green because
# it passed.
#
#   lint-rust / test-rust     Phase 2, with the first crate
#   test-rust-golden          Phase 2, with the first golden file
#   proto                     Phase 2, with the solver contract
#   test-go-integration       Phase 0, with the first store
#   licenses                  next commit
