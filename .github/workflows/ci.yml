name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch supersedes an older one, except on main
# where every commit's status is part of the record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"

jobs:
  # The advisory-only boundary (docs/SAFETY.md). Runs first and on its own
  # because it is the one check whose failure is a safety issue rather than a
  # quality issue, and it should be legible as such in the checks list.
  safety:
    name: Safety boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check no actuation capability exists
        run: ./scripts/check-safety-boundary.sh

  # The commit history is an artifact of this project, so its conventions are
  # a required check rather than a review comment.
  commit-hygiene:
    name: Commit hygiene
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Commit size
        run: |
          ./scripts/check-commit-size.sh \
            "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"

      - name: Commit messages
        run: |
          status=0
          range="origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"
          for sha in $(git rev-list "$range"); do
            git log -1 --format=%B "$sha" > /tmp/msg
            if ! ./.githooks/commit-msg /tmp/msg; then
              echo "::error::${sha:0:9} has a non-conforming commit message"
              status=1
            fi
          done
          exit $status

  lint-go:
    name: Lint (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1
          args: --timeout=5m

      - name: go vet
        run: go vet ./...

      - name: go mod tidy is committed
        run: |
          go mod tidy
          (cd tools && go mod tidy)
          if ! git diff --exit-code -- '**/go.mod' '**/go.sum' go.mod go.sum; then
            echo "::error::go.mod or go.sum is not tidy — run 'make tidy' and commit the result"
            exit 1
          fi

  build-go:
    name: Build (Go)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go build ./...

  test-go:
    name: Test (Go, unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # -short and the absence of the integration build tag both exclude
      # anything needing Postgres, Redis or FalkorDB; test-go-integration
      # below covers those.
      - run: go test -race -short -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  # The GPL boundary is a design constraint, not a packaging detail: it decides
  # which sparse-LU library the solver may link and why the SCL parser is
  # written from the schema rather than wrapping libiec61850. Checking it
  # mechanically is the only way that stays true as dependencies accumulate.
  licenses:
    name: License compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Go dependency licenses
        run: |
          go install github.com/google/go-licenses@latest
          if [ -n "$(go list ./... 2>/dev/null)" ]; then
            go-licenses check ./... \
              --disallowed_types=forbidden,restricted,unknown
          else
            echo "no Go packages yet"
          fi

      # cargo-deny runs once rust/ has members; an empty virtual workspace has
      # no dependency graph to check.
      - name: Rust dependency licenses
        run: |
          if grep -qE '^\s*members\s*=\s*\[\s*"' rust/Cargo.toml; then
            cargo install cargo-deny --locked
            (cd rust && cargo deny check licenses bans sources)
          else
            echo "rust workspace has no members yet; skipping cargo-deny"
          fi

  # Containers come from testcontainers-go rather than a GitHub `services:`
  # block, deliberately. The same harness then works identically from
  # `make test-integration` on a laptop, which matters more than the seconds a
  # services block would save — an integration suite developers cannot run
  # locally is one they stop trusting.
  test-go-integration:
    name: Test (Go, integration)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Pulled ahead of the tests so a slow registry shows up as a pull step
      # rather than as a container start-up timeout inside a test.
      - name: Pre-pull container images
        run: docker pull timescale/timescaledb-ha:pg16-all

      - run: go test -tags=integration -race -timeout 15m ./...

  lint-web:
    name: Lint (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck

  lint-rust:
    name: Lint (rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - run: cargo fmt --all --check
      # --all-targets so tests and benches are linted too. A lint that only
      # covers src/ leaves the tests — where most of this repository's
      # explanatory prose lives — unchecked.
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test-rust:
    name: Test (rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - run: cargo test --workspace --all-features

      # Release too. The solver's determinism and convergence behaviour depend
      # on optimisation level — a debug build and a release build can take
      # different iteration counts — so a suite that only ever runs in debug
      # has not tested what ships.
      - run: cargo test --workspace --all-features --release

  golden-drift:
    name: Golden references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the oracle
        run: pip install pandapower

      # The committed goldens must still be what the generator produces. A
      # golden that has drifted from its generator is a number nobody can
      # reproduce, which is the one thing this project cannot ship.
      #
      # Provenance is excluded from the comparison on purpose: regenerating
      # always rewrites generator_commit and oracle_version, so a plain
      # `git diff` would fail every run and teach everyone to ignore it. What
      # has to match is the network and the answer.
      - name: Regenerate and compare
        run: |
          python tools/goldengen/generate.py --out /tmp/regenerated
          python - <<'EOF'
          import json, pathlib, sys

          failures = []
          for committed in sorted(pathlib.Path("data/golden").glob("*.golden.json")):
              fresh = pathlib.Path("/tmp/regenerated") / committed.name
              if not fresh.exists():
                  failures.append(f"{committed.name}: the generator no longer produces this file")
                  continue
              a = json.loads(committed.read_text())
              b = json.loads(fresh.read_text())
              for section in ("case", "reference"):
                  if a[section] != b[section]:
                      failures.append(f"{committed.name}: {section} has drifted from the generator")

          if failures:
              print("::error::" + "; ".join(failures))
              sys.exit(1)
          print(f"all goldens match the generator")
          EOF

      - name: Compare against the oracle
        run: cd rust && cargo test -p bs-golden --release

  proto:
    name: Proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - run: buf lint
        working-directory: proto
      - run: buf format --diff --exit-code
        working-directory: proto

      # The committed Go stubs must be what the contract produces. Go's tooling
      # expects checked-in generated code, so it can drift from its source; a
      # stub that no longer matches its proto is a contract nobody is honouring.
      - name: Generate and diff
        working-directory: proto
        run: |
          buf generate
          if ! git diff --quiet -- gen; then
            echo "::error::committed stubs differ from what the contract produces; run 'cd proto && buf generate'"
            git diff --stat -- gen
            exit 1
          fi

      # Breaking changes against main. The solver and the platform deploy
      # separately, so a contract change that breaks one of them is an outage
      # rather than a compile error.
      - name: Breaking changes
        if: github.event_name == 'pull_request'
        working-directory: proto
        run: buf breaking --against "https://github.com/${{ github.repository }}.git#branch=${{ github.base_ref }},subdir=proto"
