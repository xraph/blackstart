name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so that newly published queries run against unchanged code.
    # Monday 06:17 UTC — off the hour to avoid the scheduling stampede.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # Rust is deliberately absent. CodeQL's Rust support is newer and
        # narrower than its Go and JavaScript coverage, and there is no Rust
        # code here yet. The solver is covered by `cargo audit` and the clippy
        # lint set instead; revisit adding Rust here when bs-solver lands.
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none

    steps:
      - uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-and-quality is broader than the default security-extended
          # and surfaces correctness issues too, which matters more than usual
          # for numerical and parsing code.
          queries: security-and-quality

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
